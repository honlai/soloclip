[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soloclip"
version = "0.1.0"
description = "Extract one ~20s single-speaker talking-head clip per source video"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["video", "diarization", "active-speaker-detection", "yt-dlp"]

# torch/torchaudio are deliberately absent: they need the CUDA-specific index
# (see README), and pinning them here would install a CPU build over a working
# GPU one. Same reason onnxruntime-gpu is pinned rather than ranged - 1.23+ is
# built against CUDA 13 and silently falls back to CPU next to torch's CUDA 12.
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "pyannote.audio>=3.3.0",
    "huggingface_hub<1.0",
    "onnxruntime-gpu==1.22.0; platform_system == 'Linux'",
    "insightface>=0.7.3",
    "opencv-python-headless>=4.10",
    "numpy>=1.26,<2.2",
    "scipy>=1.14",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "rich>=13.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
soloclip = "soloclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
